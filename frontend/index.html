<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareTrack Clinic — Medical Records</title>
    <link rel="stylesheet" href="css/styles.css" />
    <!--
        Feather Icons (MIT) — loaded from CDN for lightweight SVG icons.
        No UI framework dependency; all layout is custom CSS Grid/Flexbox.
    -->
    <script src="https://unpkg.com/feather-icons/dist/feather.min.js"></script>
</head>
<body>

<!-- ═══════════════════════ LOGIN SCREEN ════════════════════════════════════ -->
<div id="login-screen" class="login-screen">
    <div class="login-card">
        <div class="login-logo">
            <span class="logo-icon">⚕</span>
            <h1>CareTrack <span>Clinic</span></h1>
            <p>Medical Records Management System</p>
        </div>

        <form id="login-form" novalidate>
            <div class="form-group">
                <label for="login-username">Username</label>
                <input type="text"     id="login-username" placeholder="Enter username"  autocomplete="username"  required />
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="Enter password"  autocomplete="current-password" required />
            </div>
            <div id="login-error" class="alert alert-error" hidden></div>
            <button type="submit" id="login-btn" class="btn btn-primary btn-full">
                <span id="login-btn-text">Sign In</span>
                <span id="login-spinner" class="spinner" hidden></span>
            </button>
        </form>

        <p class="login-hint">
            Demo — Admin: <code>admin / Admin@1234</code><br/>
            Clinician: <code>dr_wilson / Admin@1234</code><br/>
            Receptionist: <code>receptionist / Admin@1234</code>
        </p>
    </div>
</div>

<!-- ═══════════════════════ MAIN APP ════════════════════════════════════════ -->
<div id="app" class="app-layout" hidden>

    <!-- ── Sidebar Navigation ────────────────────────────────────────────── -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="logo-icon">⚕</span>
            <span class="logo-text">CareTrack</span>
            <button class="sidebar-close" id="sidebar-close" aria-label="Close menu">
                <i data-feather="x"></i>
            </button>
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" data-view="dashboard">
                <i data-feather="grid"></i> <span>Dashboard</span>
            </a>
            <!-- Admin + Clinician + Receptionist -->
            <a href="#" class="nav-item" data-view="patients">
                <i data-feather="users"></i> <span>Patients</span>
            </a>
            <!-- Admin + Receptionist only (clinicians don't need the doctors list) -->
            <a href="#" class="nav-item" data-view="doctors" data-roles="admin,receptionist">
                <i data-feather="user-check"></i> <span>Doctors</span>
            </a>
            <!-- Admin + Clinician only -->
            <a href="#" class="nav-item" data-view="diagnoses" data-roles="admin,clinician">
                <i data-feather="activity"></i> <span>Diagnoses</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="user-chip" id="user-chip"></div>
            <button class="btn btn-ghost btn-sm" id="logout-btn">
                <i data-feather="log-out"></i> Logout
            </button>
        </div>
    </aside>

    <!-- ── Main Content ───────────────────────────────────────────────────── -->
    <main class="main-content">

        <!-- Top bar -->
        <header class="topbar">
            <button class="topbar-menu-btn" id="menu-toggle" aria-label="Open menu">
                <i data-feather="menu"></i>
            </button>
            <h2 class="topbar-title" id="page-title">Dashboard</h2>
            <div class="topbar-actions">
                <span class="role-badge" id="role-badge"></span>
            </div>
        </header>

        <!-- Alert banner (success / error notifications) -->
        <div id="app-alert" class="app-alert" hidden></div>

        <!-- ── Views (only one visible at a time) ────────────────────────── -->

        <!-- Dashboard -->
        <section id="view-dashboard" class="view active">
            <div class="stats-grid" id="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon blue"><i data-feather="user-check"></i></div>
                    <div class="stat-info">
                        <span class="stat-number" id="stat-doctors">—</span>
                        <span class="stat-label">Doctors</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green"><i data-feather="users"></i></div>
                    <div class="stat-info">
                        <span class="stat-number" id="stat-patients">—</span>
                        <span class="stat-label">Patients</span>
                    </div>
                </div>
                <div class="stat-card" id="stat-diagnoses-card">
                    <div class="stat-icon orange"><i data-feather="activity"></i></div>
                    <div class="stat-info">
                        <span class="stat-number" id="stat-diagnoses">—</span>
                        <span class="stat-label">Diagnoses</span>
                    </div>
                </div>
            </div>
            <div class="dashboard-tables">
                <div class="card">
                    <div class="card-header"><h3>Recent Patients</h3></div>
                    <div id="recent-patients-table"></div>
                </div>
            </div>
        </section>

        <!-- Doctors -->
        <section id="view-doctors" class="view" hidden>
            <div class="view-toolbar">
                <div class="search-group">
                    <i data-feather="search"></i>
                    <input type="text" id="doctor-search" placeholder="Search by name…" />
                </div>
                <select id="doctor-specialty-filter" class="filter-select">
                    <option value="">All Specialties</option>
                    <option>Cardiology</option>
                    <option>Neurology</option>
                    <option>Dermatology</option>
                    <option>Orthopedics</option>
                    <option>General Practice</option>
                </select>
                <button class="btn btn-primary" id="add-doctor-btn" data-roles="admin">
                    <i data-feather="plus"></i> Add Doctor
                </button>
            </div>
            <div id="doctors-table-container" class="table-container"></div>
        </section>

        <!-- Patients -->
        <section id="view-patients" class="view" hidden>
            <div class="view-toolbar">
                <div class="search-group">
                    <i data-feather="search"></i>
                    <input type="text" id="patient-search" placeholder="Search by name…" />
                </div>
                <select id="patient-gender-filter" class="filter-select">
                    <option value="">All Genders</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
                <button class="btn btn-primary" id="add-patient-btn" data-roles="admin,receptionist">
                    <i data-feather="plus"></i> Register Patient
                </button>
            </div>
            <div id="patients-table-container" class="table-container"></div>
        </section>

        <!-- Diagnoses -->
        <section id="view-diagnoses" class="view" hidden>
            <div class="view-toolbar">
                <div class="search-group">
                    <i data-feather="search"></i>
                    <input type="text" id="diagnosis-search" placeholder="Search ICD code or description…" />
                </div>
                <select id="diagnosis-severity-filter" class="filter-select">
                    <option value="">All Severities</option>
                    <option>Low</option>
                    <option>Medium</option>
                    <option>High</option>
                </select>
                <button class="btn btn-primary" id="add-diagnosis-btn" data-roles="admin">
                    <i data-feather="plus"></i> Add Diagnosis
                </button>
            </div>
            <div id="diagnoses-table-container" class="table-container"></div>
        </section>

        <!-- Patient Profile (nested view — rendered on-demand) -->
        <section id="view-patient-profile" class="view" hidden>
            <button class="btn btn-ghost btn-sm back-btn" id="back-from-profile">
                <i data-feather="arrow-left"></i> Back to Patients
            </button>
            <div id="patient-profile-content"></div>
        </section>

    </main>
</div>

<!-- ═══════════════════════ MODAL ════════════════════════════════════════════ -->
<div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true">
        <div class="modal-header">
            <h3 id="modal-title">Modal Title</h3>
            <button class="modal-close" id="modal-close" aria-label="Close modal">
                <i data-feather="x"></i>
            </button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer" id="modal-footer">
            <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
            <button class="btn btn-primary" id="modal-confirm">Save</button>
        </div>
    </div>
</div>

<!-- ── JS modules (order matters: api → auth → feature modules → app) ──── -->
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/doctors.js"></script>
<script src="js/patients.js"></script>
<script src="js/diagnoses.js"></script>
<script src="js/patientProfile.js"></script>
<script src="js/app.js"></script>

</body>
</html>
